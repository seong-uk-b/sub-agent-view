<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>sub-agent-view · 작업실</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/galmuri@latest/dist/galmuri.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<style>
:root{
  --ink:#171A28; --panel:#20243A; --panel-2:#2A2F49; --line:#3A3F5E;
  --text:#F1ECE2; --muted:#9A9BAE;
  --wall:#1E2742; --wall-edge:#3A4668; --baseboard:#2B3553;
  --wood:#8E5F3F; --wood-l:#9D6B48; --wood-seam:#6E4630;
  --desk:#C9A06B; --desk-d:#8E6A3C; --desk-top:#D9B27E;
  --rug:#5B4A7A; --rug-edge:#4A3C66; --rug-boss:#7A3B4A; --rug-boss-edge:#D4A24C;
  --lounge:#3F5F8F; --lounge-d:#365178;
  --amber:#FFC65C; --blue:#7FB8FF; --teal:#5EE0C8; --red:#FF6F61; --green:#7FD1A0; --violet:#B59CFF;
  --pixel:'Galmuri11','Galmuri9',ui-monospace,monospace;
  --body:'Pretendard Variable',Pretendard,-apple-system,'Apple SD Gothic Neo','Noto Sans KR',sans-serif;
  --mono:ui-monospace,'JetBrains Mono','SF Mono',Menlo,Consolas,'Pretendard Variable','Apple SD Gothic Neo','Noto Sans KR',monospace;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--ink);color:var(--text);font-family:var(--body);font-size:14px;line-height:1.5;overflow:hidden}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;padding:0}
button:focus-visible{outline:2px solid var(--amber);outline-offset:2px}

/* ---------- top bar ---------- */
.top{height:52px;display:flex;align-items:stretch;gap:24px;padding:0 20px;border-bottom:1px solid var(--line);background:var(--panel)}
.top h1{font:16px/52px var(--pixel);margin:0;flex:none}
.top-right{margin-left:auto;align-self:center;font:11px/1 var(--pixel);color:var(--muted)}
/* 세션 탭 */
.stabs{display:flex;gap:4px;align-items:stretch;overflow-x:auto;scrollbar-width:none}
.stab{position:relative;display:flex;align-items:center;gap:8px;padding:0 14px;font:12px/1 var(--pixel);color:var(--muted);border-bottom:2px solid transparent;white-space:nowrap}
.stab:hover{color:var(--text);background:rgba(255,255,255,.03)}
.stab[aria-selected=true]{color:var(--text);border-bottom-color:var(--amber)}
.stab .sdot{width:8px;height:8px;border-radius:50%;flex:none;box-shadow:0 0 0 2px rgba(0,0,0,.25)}
.stab .sdot.wait{animation:sdot 1s steps(2) infinite}
@keyframes sdot{to{opacity:.3}}
.stab .scount{font:10px/16px var(--pixel);color:var(--muted);background:var(--panel-2);padding:0 6px;border-radius:8px}
.stab[aria-selected=true] .scount{color:var(--text)}
.stab .sdesc{font:11px var(--body);color:var(--muted);max-width:140px;overflow:hidden;text-overflow:ellipsis}
/* 상태바: 사무실 위 한 줄 */
.frame{display:flex;flex-direction:column;width:972px}
.statusbar{display:flex;align-items:center;gap:16px;height:46px;padding:0 14px;background:#0F111C;border:6px solid #0F111C;border-bottom:0;color:var(--text)}
.sb-task{display:flex;align-items:baseline;gap:10px;min-width:0;flex:1}
.sb-name{font:11px/1 var(--pixel);color:var(--amber);flex:none}
.sb-title{font-size:13px;font-weight:600;white-space:nowrap}
.sb-desc{font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sb-chips{display:flex;gap:4px;flex:none}
.chip{display:flex;align-items:center;gap:6px;height:26px;padding:0 9px;border-radius:13px;font:11px/1 var(--pixel);color:var(--muted);border:1px solid transparent}
.chip .dot{width:7px;height:7px;border-radius:50%}
.chip b{font-weight:400;color:var(--text)}
.chip.zero{opacity:.4}
.chip:hover{background:var(--panel-2)}
.chip[aria-pressed=true]{background:var(--panel-2);border-color:var(--line);color:var(--text)}
.sb-clock{font:12px/1 var(--pixel);color:var(--muted);flex:none;min-width:64px;text-align:right}
.dot{width:8px;height:8px;border-radius:2px;display:inline-block}

/* ---------- stage ---------- */
.stage{position:relative;height:calc(100% - 56px);display:grid;place-items:center;padding:24px;overflow:auto}
.office{position:relative;width:960px;height:540px;border:6px solid #0F111C;box-shadow:0 0 0 1px var(--line), 0 40px 80px -40px #000;overflow:hidden;image-rendering:pixelated;
  background:
    repeating-linear-gradient(180deg, var(--wood-l) 0 2px, var(--wood) 2px 14px, var(--wood-seam) 14px 16px),
    var(--wood)}
/* 판자 이음새 */
.office::before{content:"";position:absolute;inset:0;background:
  repeating-linear-gradient(90deg, transparent 0 94px, rgba(0,0,0,.18) 94px 96px) 0 0 / 192px 32px,
  repeating-linear-gradient(90deg, transparent 0 46px, rgba(0,0,0,.18) 46px 48px) 48px 16px / 192px 32px;
  background-blend-mode:normal;pointer-events:none;opacity:.6;
  -webkit-mask:repeating-linear-gradient(180deg,#000 0 16px,transparent 16px 32px);mask:repeating-linear-gradient(180deg,#000 0 16px,transparent 16px 32px)}

/* 벽 */
.wall{position:absolute;inset:0 0 auto 0;height:76px;background:var(--wall);border-bottom:4px solid var(--wall-edge);box-shadow:0 4px 0 var(--baseboard)}
.wall-side{position:absolute;top:76px;bottom:0;width:14px;background:var(--wall);border-left:3px solid var(--wall-edge);border-right:3px solid var(--wall-edge)}
.wall-side.left{left:0;border-left:0}.wall-side.right{right:0;border-right:0}
.divider{position:absolute;left:744px;top:80px;width:14px;height:200px;background:var(--wall);border:3px solid var(--wall-edge);border-top:0}
.divider.low{top:360px;height:180px;border-bottom:0}

/* 책장 */
.shelf{position:absolute;top:10px;width:112px;height:58px;background:#6B4328;border:3px solid #3E2415;box-shadow:inset 0 0 0 2px #8A5A38}
.shelf i{position:absolute;left:5px;right:5px;height:20px;background:
  linear-gradient(90deg,#d35b5b 0 8px,#e8b04a 8px 16px,#5b9bd3 16px 22px,#7fbf6a 22px 32px,#b57fd3 32px 38px,#e8e0c8 38px 46px,#d35b5b 46px 52px,#5b9bd3 52px 62px,#e8b04a 62px 70px,#7fbf6a 70px 80px,#e8e0c8 80px 86px,#d35b5b 86px 96px);
  border-bottom:3px solid #3E2415}
.shelf i:nth-child(1){top:4px}.shelf i:nth-child(2){top:28px;filter:hue-rotate(60deg)}
/* 창문 */
.window{position:absolute;top:8px;width:160px;height:60px;background:#0E1630;border:4px solid #8F8AA8;box-shadow:inset 0 0 0 2px #0a0d1c, 0 0 24px rgba(127,184,255,.15)}
.window::before{content:"";position:absolute;left:50%;top:0;bottom:0;width:4px;background:#8F8AA8;transform:translateX(-50%)}
.window .moon{position:absolute;right:18px;top:8px;width:12px;height:12px;border-radius:50%;background:#F4E7B5;box-shadow:0 0 8px #F4E7B5}
.window .bld{position:absolute;bottom:0;background:#1C2650}
.window .bld i{position:absolute;width:2px;height:2px;background:#FFD98A}
/* 화이트보드 */
.board{position:absolute;top:10px;width:200px;height:56px;background:#F3EEDF;border:4px solid #7A5A3A;padding:5px 9px;font:9px/12px var(--pixel);color:#3A2F26}
.board b{display:block;color:#9B2F2F;margin-bottom:2px}
.board span{color:#3A2F26}
.board span.sub{color:#2F6B9B}
/* 시계 */
.clockw{position:absolute;top:14px;width:34px;height:34px;border-radius:50%;background:#F4EFE4;border:3px solid #2B2233}
.clockw::before,.clockw::after{content:"";position:absolute;left:50%;top:50%;background:#2B2233;transform-origin:0 50%}
.clockw::before{width:11px;height:2px;transform:rotate(-60deg)}.clockw::after{width:8px;height:2px;transform:rotate(30deg)}
.clockw i{position:absolute;left:50%;top:50%;width:9px;height:1px;background:#D35B5B;transform-origin:0 50%;transform:rotate(140deg)}

/* 러그 */
.rug{position:absolute;background:var(--rug);box-shadow:inset 0 0 0 4px var(--rug-edge), inset 0 0 0 8px var(--rug), inset 0 0 0 10px var(--rug-edge)}
.rug.boss{background:var(--rug-boss);box-shadow:inset 0 0 0 3px var(--rug-boss-edge), inset 0 0 0 6px var(--rug-boss), inset 0 0 0 8px var(--rug-boss-edge)}
.rug.boss::after{content:"";position:absolute;inset:14px;border:2px dashed var(--rug-boss-edge);opacity:.6}

/* 휴게실 */
.lounge{position:absolute;left:758px;top:80px;width:188px;height:460px;background:var(--lounge);box-shadow:inset 0 0 0 1px var(--lounge-d)}
.lounge::before{content:"";position:absolute;inset:0;background:repeating-linear-gradient(90deg,transparent 0 30px,rgba(0,0,0,.06) 30px 32px),repeating-linear-gradient(180deg,transparent 0 30px,rgba(0,0,0,.06) 30px 32px)}
.lounge .label{position:absolute;left:12px;top:10px;font:10px/1 var(--pixel);color:#CFE0F8;opacity:.7}
.sofa{position:absolute;left:28px;top:220px;width:132px;height:46px;background:#B3485C;border-radius:4px;box-shadow:inset 0 -14px 0 #8E3748, inset 0 0 0 3px #2B2233}
.sofa::before,.sofa::after{content:"";position:absolute;top:-12px;width:18px;height:58px;background:#B3485C;border-radius:4px;box-shadow:inset 0 0 0 3px #2B2233}
.sofa::before{left:-10px}.sofa::after{right:-10px}
.sofa .back{position:absolute;left:0;right:0;top:-22px;height:22px;background:#C25B6E;border-radius:6px 6px 0 0;box-shadow:inset 0 0 0 3px #2B2233}
.ctable{position:absolute;left:52px;top:296px;width:84px;height:34px;background:var(--desk);border:3px solid #2B2233;border-radius:4px;box-shadow:inset 0 -8px 0 var(--desk-d)}
.ctable::after{content:"";position:absolute;left:36px;top:8px;width:10px;height:10px;background:#F4EFE4;border:2px solid #2B2233}
.coffee{position:absolute;left:146px;top:350px;width:28px;height:62px;background:#55607A;border:3px solid #2B2233;border-radius:3px}
.coffee::before{content:"";position:absolute;left:5px;top:6px;width:12px;height:7px;background:#FF8E5B;box-shadow:0 0 6px #FF8E5B}
.coffee::after{content:"";position:absolute;left:7px;bottom:5px;width:8px;height:10px;background:#F4EFE4;border:2px solid #2B2233}
.cooler{position:absolute;width:24px;height:70px}
.cooler::before{content:"";position:absolute;left:3px;top:0;width:18px;height:28px;background:#9FD3F5;border:3px solid #2B2233;border-radius:6px 6px 2px 2px;box-shadow:inset -4px 0 0 #6FB3DF}
.cooler::after{content:"";position:absolute;left:0;top:26px;width:24px;height:44px;background:#E8E4DA;border:3px solid #2B2233;border-radius:2px;box-shadow:inset 0 -10px 0 #BDB8AC}
.plant{position:absolute;width:34px;height:52px}
.plant::before{content:"";position:absolute;left:6px;bottom:0;width:22px;height:18px;background:#A05A3A;border:3px solid #2B2233;border-top:5px solid #C27A50}
.plant::after{content:"";position:absolute;left:0;top:0;width:34px;height:36px;background:#3F8A4F;border:3px solid #2B2233;
  clip-path:polygon(50% 0,70% 20%,100% 25%,85% 50%,95% 80%,65% 70%,50% 100%,35% 70%,5% 80%,15% 50%,0 25%,30% 20%)}
.printer{position:absolute;width:56px;height:38px;background:#E8E4DA;border:3px solid #2B2233;border-radius:3px;box-shadow:inset 0 -10px 0 #BDB8AC}
.printer::before{content:"";position:absolute;left:10px;top:-10px;width:30px;height:12px;background:#fff;border:3px solid #2B2233;border-bottom:0}
.printer::after{content:"";position:absolute;right:6px;top:6px;width:6px;height:6px;background:#7FD1A0;border-radius:50%;box-shadow:0 0 5px #7FD1A0}
.bin{position:absolute;width:20px;height:24px;background:#8A8FA8;border:3px solid #2B2233;border-radius:0 0 4px 4px}

/* 책상 */
.desk{position:absolute;width:120px;height:46px;background:var(--desk);border:3px solid #2B2233;border-radius:3px;box-shadow:inset 0 4px 0 var(--desk-top), inset 0 -10px 0 var(--desk-d);z-index:4}
.desk.boss{width:156px;height:52px}
.desk .legs{position:absolute;left:8px;right:8px;bottom:-10px;height:10px;border-left:6px solid #2B2233;border-right:6px solid #2B2233}
.desk .monitor{position:absolute;left:8px;top:-26px;width:40px;height:30px;background:#2A2D3E;border:3px solid #2B2233;border-radius:3px}
.desk.boss .monitor{left:14px}
.desk .monitor::after{content:"";position:absolute;left:50%;bottom:-9px;transform:translateX(-50%);width:14px;height:6px;background:#2B2233}
.desk .screen{position:absolute;inset:2px;background:#161A28;overflow:hidden}
.desk .screen::before{content:"";position:absolute;inset:2px;background:repeating-linear-gradient(180deg,transparent 0 3px,var(--sc,#3a3d55) 3px 5px),repeating-linear-gradient(90deg,transparent 0 6px,rgba(0,0,0,.4) 6px 9px);opacity:0}
.desk[data-screen=on] .screen{background:#10151F;box-shadow:0 0 16px var(--sc)}
.desk[data-screen=on] .screen::before{opacity:.9;animation:scroll 1.2s linear infinite}
.desk[data-screen=dim] .screen{box-shadow:0 0 8px rgba(255,111,97,.4)}
.desk[data-screen=dim] .screen::before{opacity:.25}
@keyframes scroll{to{background-position:0 -10px,0 0}}
.desk .kb{position:absolute;left:62px;top:12px;width:40px;height:9px;background:#3A3E55;border:2px solid #2B2233;border-radius:2px;background-image:repeating-linear-gradient(90deg,transparent 0 3px,#2B2233 3px 4px)}
.desk.boss .kb{left:78px}
.desk.boss .mug{right:30px}
.desk .mug{position:absolute;right:10px;top:12px;width:10px;height:11px;background:#F4EFE4;border:2px solid #2B2233;border-radius:1px}
.desk .mug::after{content:"";position:absolute;right:-6px;top:2px;width:4px;height:5px;border:2px solid #2B2233;border-left:0;border-radius:0 3px 3px 0}
.desk .papers{position:absolute;left:52px;top:4px;width:0;height:0}
.desk .lamp{position:absolute;right:6px;top:-24px;width:5px;height:28px;background:#2B2233}
.desk .lamp::before{content:"";position:absolute;left:-9px;top:-6px;width:24px;height:10px;background:#FFD27A;border:2px solid #2B2233;border-radius:3px 3px 0 0;box-shadow:0 14px 22px rgba(255,210,122,.25)}
.chair{position:absolute;width:40px;height:16px;background:#3E8A6E;border:3px solid #2B2233;border-radius:8px 8px 3px 3px;z-index:2}
.desk.empty{opacity:.75}
.desk.empty .nameplate{color:var(--muted)}
.nameplate{position:absolute;left:50%;top:54px;transform:translateX(-50%);font:10px/1 var(--pixel);color:#F1ECE2;background:#2B2233;padding:3px 7px;white-space:nowrap;border-radius:2px;z-index:5}

/* 캐릭터 */
.agent{position:absolute;width:48px;height:96px;cursor:pointer;z-index:3;transition:left .9s ease,top .9s ease}
.spr{width:48px;height:96px;background-repeat:no-repeat;background-size:336px 288px;image-rendering:pixelated}
.agent .spr{position:absolute;left:0;top:0;filter:drop-shadow(0 2px 0 rgba(0,0,0,.25))}
.agent .body{position:absolute;inset:0}
.agent[data-state=edit] .body,.agent[data-state=run] .body{animation:typebob .5s steps(2) infinite}
.agent[data-state=idle] .body,.agent[data-state=done] .body,.agent[data-state=delegating] .body,.agent[data-state=read] .body{animation:breathe 1.8s steps(2) infinite}
@keyframes typebob{to{transform:translateY(-1px)}}
@keyframes breathe{to{transform:translateY(-1px)}}
.agent.selected::after{content:"";position:absolute;left:10px;right:10px;bottom:-2px;height:3px;background:var(--amber);box-shadow:0 0 0 2px #2B2233}
.bubble{position:absolute;left:50%;top:-20px;transform:translateX(-50%);min-width:24px;height:22px;padding:0 8px;background:#FFFDF7;color:#2B2233;font:10px/22px var(--pixel);white-space:nowrap;border:2px solid #2B2233;border-radius:8px;box-shadow:2px 2px 0 #2B2233;z-index:6}
.bubble::after{content:"";position:absolute;left:50%;bottom:-8px;transform:translateX(-50%);border:5px solid transparent;border-top:6px solid #2B2233;border-bottom:0}
.bubble::before{content:"";position:absolute;left:50%;bottom:-4px;transform:translateX(-50%);border:4px solid transparent;border-top:4px solid #FFFDF7;border-bottom:0;z-index:1}
.bubble.wait{background:var(--red);color:#fff;animation:pulse 1s steps(2) infinite;font-weight:700}
.bubble.wait::before{border-top-color:var(--red)}
.bubble.done{background:var(--green)}.bubble.done::before{border-top-color:var(--green)}
@keyframes pulse{to{transform:translate(-50%,-3px)}}
.zz{position:absolute;left:36px;top:-6px;font:10px var(--pixel);color:#CFE0F8;animation:zz 2s steps(3) infinite}
@keyframes zz{to{transform:translate(6px,-10px);opacity:0}}

/* 연결선 */
.links{position:absolute;inset:0;pointer-events:none;z-index:1}
.links path{fill:none;stroke-width:2;stroke-dasharray:3 7;opacity:.45;stroke-linecap:round}
.links path.active{animation:dash 1.2s linear infinite}
.links path.done{stroke-dasharray:none;opacity:.15}
@keyframes dash{to{stroke-dashoffset:-20}}


/* ---------- popover ---------- */
.pop{position:fixed;z-index:20;width:320px;background:var(--panel);border:1px solid var(--line);border-radius:10px;box-shadow:0 20px 50px -20px #000, 0 0 0 1px #0008;display:none}
.pop.show{display:block;animation:popin .14s ease-out}
.pop.show.still{animation:none}
@keyframes popin{from{opacity:0;transform:translateY(4px) scale(.98)}}
.pop::before{content:"";position:absolute;left:var(--ax,50%);top:-7px;width:12px;height:12px;background:var(--panel);border-left:1px solid var(--line);border-top:1px solid var(--line);transform:translateX(-50%) rotate(45deg)}
.pop.flip::before{top:auto;bottom:-7px;transform:translateX(-50%) rotate(225deg)}
.pop.side::before{top:var(--ay,40px);left:-7px;transform:translateY(-50%) rotate(-45deg)}
.pop.side.leftside::before{left:auto;right:-7px;transform:translateY(-50%) rotate(135deg)}
.pop header{display:flex;align-items:center;gap:10px;padding:14px 14px 10px}
.pop header .avatar{width:48px;height:56px;position:relative;flex:none;background:var(--panel-2);border-radius:8px;overflow:hidden}
.pop header .avatar .spr{position:absolute;left:0;top:-2px}
.pop header h2{margin:0;font:14px/1.2 var(--pixel)}
.pop header .meta{display:flex;gap:6px;margin-top:4px;font-size:11px;color:var(--muted)}
.state{display:inline-flex;align-items:center;gap:6px;padding:2px 7px;border-radius:4px;font:11px/16px var(--pixel);background:var(--panel-2)}
.pop .section{padding:10px 14px;border-top:1px solid var(--line)}
.pop .section .k{font-size:11px;color:var(--muted);margin-bottom:3px}
.pop .section .v{font-size:13px}
.pop .now{display:flex;gap:8px;align-items:flex-start;padding:10px 12px;background:#161826;border-radius:6px;margin-top:4px;border-left:3px solid var(--sc,var(--amber))}
.pop .now .tool{font:12px var(--pixel);color:var(--sc,var(--amber))}
.pop .now .target{font:12px var(--mono);color:#c9d1ff;word-break:break-all}
.pop .stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.pop .stats div{background:#161826;border-radius:6px;padding:8px 10px}
.pop .stats .n{font:14px/1 var(--pixel)}
.pop .stats .k{margin:4px 0 0;font-size:11px}
.pop .recent{list-style:none;margin:0;padding:0;font-size:12px;color:#cfd0dd}
.pop .recent li{display:flex;gap:8px;padding:3px 0}
.pop .recent li span:first-child{color:var(--muted);font:11px var(--mono);flex:none;width:38px}
.pop footer{display:flex;gap:8px;padding:12px 14px;border-top:1px solid var(--line)}
.btn{flex:1;padding:9px 10px;border-radius:7px;font:12px/1 var(--pixel);border:1px solid var(--line);background:var(--panel-2);text-align:center}
.btn.primary{background:var(--amber);color:#1A1C2A;border-color:var(--amber)}
.btn.danger{background:transparent;color:var(--red);border-color:#6a3a3a}
.btn.ok{background:var(--green);color:#1A1C2A;border-color:var(--green)}
.pop .warn{margin:8px 14px 0;padding:10px 12px;border-radius:6px;background:#3a2426;border:1px solid #6a3a3a;font-size:12px}
.pop .warn b{display:block;font:11px var(--pixel);color:var(--red);margin-bottom:4px}

/* ---------- drawer ---------- */
.drawer{position:fixed;top:0;right:0;bottom:0;width:560px;max-width:100vw;background:#121420;border-left:1px solid var(--line);transform:translateX(100%);transition:transform .22s ease;z-index:30;display:flex;flex-direction:column;box-shadow:-30px 0 60px -40px #000}
.drawer.open{transform:none}
.drawer .head{display:flex;align-items:center;gap:12px;padding:12px 16px;border-bottom:1px solid var(--line);background:var(--panel)}
.drawer .head .avatar{width:38px;height:42px;position:relative;background:var(--panel-2);border-radius:6px;overflow:hidden;flex:none}
.drawer .head .avatar .spr{position:absolute;left:-5px;top:-2px;transform:scale(.72);transform-origin:top center}

const pop = document.getElementById('pop');
function openPop(a, el, refresh=false){
  selected = a.id; AGENTS.forEach(positionAgent);
  const s = STATES[a.state];
  const now = a.state==='done'
    ? `<div class="now" style="--sc:${s.raw}"><div><div class="tool">보고 완료</div><div class="target">${a.summary}</div></div></div>`
    : `<div class="now" style="--sc:${s.raw}"><div><div class="tool">${a.tool}</div><div class="target">${a.target}</div></div></div>`;
  const warn = a.state==='wait' ? `<div class="warn"><b>${a.waitReason}</b>${a.waitDetail}</div>` : '';
  const foot = a.state==='wait'
    ? `<button class="btn ok" data-act="allow">허용</button><button class="btn danger" data-act="deny">거부</button><button class="btn" data-act="detail">상세히</button>`
    : `<button class="btn primary" data-act="detail">상세히 · 터미널 열기</button>${a.id!=='main'?'<button class="btn danger" data-act="stop">중지</button>':''}`;
  pop.innerHTML = `
    <header>${avatarHTML(a,'avatar')}<div><h2>${a.name}</h2><div class="meta"><span class="state" style="color:${s.raw}">${s.label}</span><span>${a.type}</span><span>·</span><span>${a.model}</span></div></div></header>
    <div class="section"><div class="k">맡은 일</div><div class="v">${a.task}</div></div>
    <div class="section"><div class="k">${a.state==='done'?'결과':'지금 하는 일'}</div>${now}</div>
    ${warn}
    <div class="section stats"><div><div class="n elapsed">${fmt(elapsedOf(a))}</div><div class="k">경과</div></div><div><div class="n">${a.tools}</div><div class="k">도구 호출</div></div><div><div class="n">${(a.tokens/1000).toFixed(1)}k</div><div class="k">토큰</div></div></div>
    <div class="section"><div class="k">최근 활동</div><ul class="recent">${a.recent.map(([t,x])=>`<li><span>${t}</span><span>${x}</span></li>`).join('')}</ul></div>
    <footer>${foot}</footer>`;
  pop.className = 'pop show' + (refresh?' still':'');
  const r = el.getBoundingClientRect(), W = 320, H = pop.offsetHeight, vw = window.innerWidth, vh = window.innerHeight;
  let left, top;
  if(r.bottom + 14 + H <= vh - 12){ top = r.bottom + 14; }                       // 아래
  else if(r.top - 14 - H >= 12){ top = r.top - 14 - H; pop.classList.add('flip'); } // 위
  else {                                                                           // 옆
    pop.classList.add('side'); top = Math.max(12, Math.min(vh - H - 12, r.top + r.height/2 - 60));
    if(r.right + 16 + W <= vw - 12) left = r.right + 16; else { left = r.left - 16 - W; pop.classList.add('leftside'); }
    pop.style.setProperty('--ay', (r.top + r.height/2 - top)+'px');
  }
  if(left===undefined){ left = Math.max(12, Math.min(vw - W - 12, r.left + r.width/2 - W/2)); pop.style.setProperty('--ax', (r.left + r.width/2 - left)+'px'); }
  pop.style.left = left+'px'; pop.style.top = top+'px';
  pop.onclick = e=>{
    const b = e.target.closest('[data-act]'); if(!b) return; const act = b.dataset.act;
    if(act==='detail'){ openDrawer(a); closePop(); }
    if(act==='allow'){ a.state='run'; a.tool='Bash'; a.target='rm -rf dist/ && npm run build'; a.log.push(['sys','사용자가 허용함'],['out','> tsc -p tsconfig.build.json'],['out','빌드 중…']); a.recent.unshift(['방금','Bash 권한 허용됨']); renderAll(); openPop(a, el, true); }
    if(act==='deny'){ a.state='edit'; a.tool='Edit'; a.target='src/api/refund.ts'; a.log.push(['sys','사용자가 거부함 · 빌드 없이 리뷰 계속'],['tool','Edit','src/api/refund.ts']); a.recent.unshift(['방금','Bash 권한 거부됨']); renderAll(); openPop(a, el, true); }
    if(act==='stop'){ finish(a, '사용자가 중지함', ['err','사용자가 에이전트를 중지함']); closePop(); }
  };
}
function finish(a, summary, logLine){
  a.state='done'; a.end=(Date.now()-t0)/1000; a.summary=summary; a.log.push(logLine);
  const used = AGENTS.filter(x=>x!==a && x.spot).map(x=>x.spot.x); a.spot = SOFA_SPOTS.find(s=>!used.includes(s.x)) || SOFA_SPOTS[2];
  a.recent.unshift(['방금','메인 세션에 결과 보고']); renderAll();
}

    const a = drawerAgent;

                   read:[['tool','Read',`src/auth/${['session','client','store','types'][Math.floor(Math.random()*4)]}.ts`],['out',`${20+Math.floor(Math.random()*80)}줄 읽음`]],
                   run:[['out',`✓ tests/${['payments.webhook','payments.retry','payments.idempotency'][Math.floor(Math.random()*3)]}.spec.ts (${3+Math.floor(Math.random()*9)})`]]}[a.state];

    if(a.cycle){

    a.recent = a.recent.slice(0,3);
  });
  renderAll();
  if(selected){ const a = AGENTS.find(x=>x.id===selected); openPop(a, document.getElementById('ag-'+a.id), true); }
}, 4000);

loadSession(session);

// 데모용: URL 해시로 세션/팝오버/드로어 바로 열기 (예: #session=s2, #pop=a4, #drawer=a2)
const demo = new URLSearchParams(location.hash.slice(1));
if(demo.get('session')){ const s = SESSIONS.find(x=>x.id===demo.get('session')); if(s) loadSession(s); }
if(demo.get('pop')){ const a = AGENTS.find(x=>x.id===demo.get('pop')); if(a) setTimeout(()=>openPop(a, document.getElementById('ag-'+a.id)), 50); }
if(demo.has('measure')){ // 메모리 측정용: N초 뒤 body에 기록 (#measure=20000)
  const wait = +demo.get('measure') || 20000;
  const snap = () => ({ t: Math.round(performance.now()), heapUsedMB: performance.memory ? +(performance.memory.usedJSHeapSize/1048576).toFixed(2) : null, heapTotalMB: performance.memory ? +(performance.memory.totalJSHeapSize/1048576).toFixed(2) : null, nodes: document.getElementsByTagName('*').length, logLines: AGENTS.reduce((n,a)=>n+a.log.length,0) });
  const samples=[snap()]; const iv=setInterval(()=>samples.push(snap()), 5000);
  setTimeout(()=>{ clearInterval(iv); samples.push(snap()); document.body.dataset.mem = JSON.stringify(samples); }, wait);
}
if(demo.get('drawer')){ const a = AGENTS.find(x=>x.id===demo.get('drawer')); if(a) setTimeout(()=>{ openDrawer(a); streamIdx=a.log.length; renderTerm(a); }, 50); }
</script>
</body>
</html>
